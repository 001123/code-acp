name: Release

# On every push to main, release-please opens or updates a release PR that bumps the version and adds the
# commits since the last release to CHANGELOG.md. Merging that PR tags the release, and the publish job ships it.
# Publishing lives in this workflow because a tag pushed with GITHUB_TOKEN does not trigger other workflows, and
# Marketplace and Open VSX trusted publishing are bound to this file name.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run check
      - run: npm run package

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath "release/kd-code-$VERSION.vsix"

      - name: Attach the package to the GitHub release
        run: gh release upload "$TAG" "release/kd-code-$VERSION.vsix"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Open VSX
        run: npx --yes ovsx@^1.3.0 publish --trusted-publishing --packagePath "release/kd-code-$VERSION.vsix"
