name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run check
      - run: npm run package

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath "release/kd-code-$VERSION.vsix"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "release/kd-code-$VERSION.vsix"

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "release/kd-code-$VERSION.vsix" --title "$GITHUB_REF_NAME" --notes-file release/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
